<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="24" fill="#0a0a0a" />
  <!-- Alarm clock outer ring -->
  <circle cx="50" cy="55" r="30" fill="none" stroke="#00ffcc" stroke-width="8" />
  <!-- Clock bells / rooster comb -->
  <path d="M 25 25 Q 35 10 45 25" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" />
  <path d="M 75 25 Q 65 10 55 25" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" />
  <!-- Clock hands / heartbeat -->
  <path d="M 35 55 L 45 55 L 50 40 L 55 70 L 60 55 L 65 55" fill="none" stroke="#00ffcc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
